plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'ir.amnayar.app'
    compileSdk 35

    defaultConfig {
        applicationId 'ir.amnayar.app'
        minSdk 23
        targetSdk 35
        versionCode 4
        versionName '1.0.3'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}
