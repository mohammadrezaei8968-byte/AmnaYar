plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'ir.amnayar.app'
    compileSdk 35

    signingConfigs {
        release {
            storeFile file(System.getenv('AMNAYAR_KEYSTORE_PATH'))
            storePassword System.getenv('AMNAYAR_KEYSTORE_PASSWORD')
            keyAlias System.getenv('AMNAYAR_KEY_ALIAS')
            keyPassword System.getenv('AMNAYAR_KEY_PASSWORD')
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
        }
    }

    defaultConfig {
        applicationId 'ir.amnayar.app'
        minSdk 23
        targetSdk 35
        versionCode 9
        versionName '1.0.8'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}
