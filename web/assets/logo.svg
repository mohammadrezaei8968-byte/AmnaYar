<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 180" role="img" aria-labelledby="title desc">
<title id="title">امنا یار | AmnaYar</title>
<desc id="desc">لوگوی سه‌بعدی امنا یار با نماد سپر و تیک تأیید</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#123A72"/><stop offset="0.55" stop-color="#1469A8"/><stop offset="1" stop-color="#18A67A"/></linearGradient>
  <linearGradient id="shine" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ffffff" stop-opacity=".95"/><stop offset=".45" stop-color="#dffcff" stop-opacity=".7"/><stop offset="1" stop-color="#8ee1cf" stop-opacity=".25"/></linearGradient>
  <linearGradient id="text" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#0B2A55"/><stop offset="1" stop-color="#159078"/></linearGradient>
  <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="10" stdDeviation="8" flood-color="#0b2a55" flood-opacity=".22"/></filter>
  <filter id="soft" x="-30%" y="-30%" width="160%" height="170%"><feGaussianBlur stdDeviation="3"/></filter>
</defs>
<!-- white premium background -->
<rect width="640" height="180" rx="30" fill="#fff"/>
<!-- 3D security emblem -->
<g transform="translate(22 18)" filter="url(#shadow)">
  <rect x="8" y="8" width="144" height="144" rx="38" fill="#082650" opacity=".18" filter="url(#soft)"/>
  <rect x="0" y="0" width="144" height="144" rx="38" fill="url(#bg)"/>
  <path d="M72 18 112 33v31c0 29-17 48-40 59C49 112 32 93 32 64V33z" fill="url(#shine)" opacity=".95"/>
  <path d="M72 28 103 40v24c0 23-12 38-31 48-19-10-31-25-31-48V40z" fill="#0B2A55" opacity=".82"/>
  <path d="m48 70 16 16 33-37" fill="none" stroke="#fff" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="116" cy="27" r="9" fill="#fff" opacity=".75"/>
</g>
<!-- bilingual brand lockup -->
<g font-family="Tahoma, Arial, sans-serif">
  <text x="610" y="92" text-anchor="end" direction="rtl" fill="url(#text)" font-size="46" font-weight="800">امنا یار</text>
  <text x="610" y="132" text-anchor="end" fill="#42627f" font-size="25" font-weight="700" letter-spacing="1">AmnaYar</text>
</g>
</svg>