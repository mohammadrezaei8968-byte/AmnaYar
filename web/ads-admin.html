<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="/styles.css?v=3928"><title>مدیریت تبلیغات | امنا یار</title><style>
.ads-admin{max-width:1250px;margin:25px auto;padding:0 18px}.ad-kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.ad-kpi,.ad-box{background:#fff;border:1px solid #e5eaf1;border-radius:18px;padding:18px;margin-top:15px}.ad-kpi small{display:block;color:#667085}.ad-kpi b{font-size:27px}.ad-form{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.ad-form label{display:grid;gap:6px}.ad-form input,.ad-form select,.ad-form textarea{padding:10px;border:1px solid #d8dee8;border-radius:10px;font:inherit}.ad-form textarea{min-height:80px}.ad-table{width:100%;border-collapse:collapse}.ad-table th,.ad-table td{padding:10px;border-bottom:1px solid #edf0f4;text-align:right}.ad-actions{display:flex;gap:6px;flex-wrap:wrap}@media(max-width:800px){.ad-kpis,.ad-form{grid-template-columns:1fr 1fr}}@media(max-width:550px){.ad-kpis,.ad-form{grid-template-columns:1fr}.table-wrap{overflow:auto}.ad-table{min-width:900px}}
</style></head><body><header class="nav"><a class="brand" href="/"><img src="/assets/logo-amnayar.png" alt="امنا یار"><span>امنا یار<small>مدیریت تبلیغات</small></span></a></header><main class="ads-admin"><div id="login" class="ad-box"><h2>ورود مالک</h2><form id="loginForm" class="ad-form"><label>ایمیل<input id="email" type="email" required></label><label>رمز عبور<input id="password" type="password" required></label><button class="btn primary" style="align-self:end">ورود</button></form><p id="msg"></p></div><div id="app" hidden><h1>مدیریت درآمد تبلیغاتی</h1><p class="muted">کمپین، تبلیغ‌دهنده، جایگاه و آمار نمایش/کلیک را از اینجا مدیریت کن.</p><div class="ad-kpis"><div class="ad-kpi"><small>کمپین‌ها</small><b id="campaigns">0</b></div><div class="ad-kpi"><small>کمپین فعال</small><b id="active">0</b></div><div class="ad-kpi"><small>نمایش</small><b id="impressions">0</b></div><div class="ad-kpi"><small>کلیک</small><b id="clicks">0</b></div></div><section class="ad-box"><h2>ثبت تبلیغ‌دهنده</h2><form id="advForm" class="ad-form"><label>نام برند/شرکت<input id="advName" required></label><label>نام تماس<input id="advContact"></label><label>ایمیل<input id="advEmail" type="email"></label><label>تلفن<input id="advPhone"></label><label>وب‌سایت<input id="advWebsite"></label><button class="btn primary" style="align-self:end">ثبت</button></form></section><section class="ad-box"><h2>ثبت کمپین</h2><form id="campForm" class="ad-form"><label>نام کمپین<input id="cName" required></label><label>تبلیغ‌دهنده<select id="cAdv"></select></label><label>جایگاه<select id="cPlacement"><option value="leader">لیدربورد بالا</option><option value="bottom-1">پایین صفحه ۱</option><option value="bottom-2">پایین صفحه ۲</option></select></label><label>عنوان<input id="cHeadline"></label><label>متن<input id="cBody"></label><label>CTA<input id="cCta" value="مشاهده"></label><label>لینک مقصد<input id="cUrl" type="url"></label><label>آدرس تصویر<input id="cImage" type="url"></label><label>مبلغ قرارداد (تومان)<input id="cPrice" type="number" min="0"></label><button class="btn primary" style="align-self:end">ایجاد کمپین</button></form></section><section class="ad-box"><h2>درخواست‌های تبلیغاتی جدید</h2><div class="table-wrap"><table class="ad-table"><thead><tr><th>برند</th><th>تماس</th><th>جایگاه</th><th>بودجه</th><th>تاریخ</th></tr></thead><tbody id="leads"></tbody></table></div></section><section class="ad-box"><h2>کمپین‌ها</h2><div class="table-wrap"><table class="ad-table"><thead><tr><th>کمپین</th><th>برند</th><th>جایگاه</th><th>وضعیت</th><th>نمایش</th><th>کلیک</th><th>CTR</th><th>عملیات</th></tr></thead><tbody id="rows"></tbody></table></div></section></div></main><script>
const API='https://api.amnayar.ir',KEY='amnayar_owner_token',q=id=>document.getElementById(id);let data=null;
async function api(u,o={}){const h=new Headers(o.headers||{});const t=localStorage.getItem(KEY);if(t)h.set('Authorization','Bearer '+t);if(o.body)h.set('Content-Type','application/json');const r=await fetch(API+u,{...o,headers:h,cache:'no-store'});let j={};try{j=await r.json()}catch{}return j}
q('loginForm').onsubmit=async e=>{e.preventDefault();const r=await api('/api/owner/login',{method:'POST',body:JSON.stringify({email:q('email').value,password:q('password').value})});if(!r.token){q('msg').textContent=r.message||r.error;return}localStorage.setItem(KEY,r.token);boot()};
async function boot(){q('login').hidden=true;q('app').hidden=false;await load()}
async function load(){data=await api('/api/owner/ads/overview');if(data.error){q('login').hidden=false;q('app').hidden=true;return}q('campaigns').textContent=data.campaigns.length;q('active').textContent=data.totals.active_campaigns||0;q('impressions').textContent=data.events.find(x=>x.event_type==='impression')?.count||0;q('clicks').textContent=data.events.find(x=>x.event_type==='click')?.count||0;q('cAdv').innerHTML='<option value="">بدون برند</option>'+data.advertisers.map(a=>'<option value="'+a.id+'">'+a.name.replace(/</g,'&lt;')+'</option>').join('');q('leads').innerHTML=(data.leads||[]).map(l=>'<tr><td>'+esc(l.brand_name)+'</td><td>'+esc(l.phone||l.email||'—')+'</td><td>'+esc(l.placement)+'</td><td>'+Number(l.budget_toman||0).toLocaleString('fa-IR')+'</td><td>'+esc(l.created_at)+'</td></tr>').join('')||'<tr><td colspan="5">هنوز درخواست جدیدی ثبت نشده است.</td></tr>';q('rows').innerHTML=data.campaigns.map(c=>'<tr><td>'+esc(c.name)+'</td><td>'+esc(c.advertiser_name||'—')+'</td><td>'+esc(c.placement)+'</td><td>'+esc(c.status)+'</td><td>'+c.impressions+'</td><td>'+c.clicks+'</td><td>'+c.ctr+'%</td><td class="ad-actions"><button class="btn soft" onclick="toggle('+c.id+',\''+(c.status==='active'?'draft':'active')+'\')">'+(c.status==='active'?'توقف':'فعال‌سازی')+'</button><button class="btn soft" onclick="delCamp('+c.id+')">حذف</button></td></tr>').join('')||'<tr><td colspan="8">هنوز کمپینی ثبت نشده است.</td></tr>'}
function esc(s){return String(s??'').replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]))}
q('advForm').onsubmit=async e=>{e.preventDefault();const r=await api('/api/owner/ads/advertisers',{method:'POST',body:JSON.stringify({name:q('advName').value,contact_name:q('advContact').value,email:q('advEmail').value,phone:q('advPhone').value,website:q('advWebsite').value})});if(r.error)return alert(r.error);e.target.reset();load()};
q('campForm').onsubmit=async e=>{e.preventDefault();const r=await api('/api/owner/ads/campaigns',{method:'POST',body:JSON.stringify({name:q('cName').value,advertiser_id:q('cAdv').value||null,placement:q('cPlacement').value,headline:q('cHeadline').value,body:q('cBody').value,cta:q('cCta').value,destination_url:q('cUrl').value,image_url:q('cImage').value,price_toman:Number(q('cPrice').value||0),status:'draft'})});if(r.error)return alert(r.error);e.target.reset();load()};
async function toggle(id,status){await api('/api/owner/ads/campaigns/'+id,{method:'PATCH',body:JSON.stringify({status})});load()}async function delCamp(id){if(!confirm('کمپین حذف شود؟'))return;await api('/api/owner/ads/campaigns/'+id,{method:'DELETE'});load()}if(localStorage.getItem(KEY))boot();
</script></body></html>
