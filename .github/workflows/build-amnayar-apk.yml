name: Build AmnaYar Android APK
# Rebuild on the latest source after the website publish step was made concurrency-safe.

on:
  push:
    branches: ["main"]
    paths:
      - "android/**"
      - "web/tools.js"
      - "web/tools.html"
      - ".github/workflows/build-amnayar-apk.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK components
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11"

      - name: Install AmnaYar logo
        run: |
          mkdir -p android/app/src/main/res/drawable
          curl -fsSL "https://raw.githubusercontent.com/mohammadrezaei8968-byte/AmnaYar/main/web/assets/logo-amnayar.png" -o android/app/src/main/res/drawable/logo.png
          test -s android/app/src/main/res/drawable/logo.png

      - name: Check JavaScript syntax
        run: |
          node --check web/tools.js
          node --check web/app.js
          node --check gateway/server.js
          node --check backend/src/server.js
          grep -q 'tools.js?v=61026' web/tools.html
          ! grep -q 'گفتار به نوشتار' web/index.html
          grep -q 'id="translationFile"' web/tools.html
          grep -q 'async function translateUploadedFile' web/tools.js
          grep -q 'app.js?v=3958' web/index.html
          grep -q 'versionName = "1.0.7"' android/app/build.gradle.kts
          git diff --check

      - name: Prepare optional Cafe Bazaar release signing
        env:
          AMNAYAR_KEYSTORE_BASE64: ${{ secrets.AMNAYAR_KEYSTORE_BASE64 }}
          AMNAYAR_KEYSTORE_PASSWORD: ${{ secrets.AMNAYAR_KEYSTORE_PASSWORD }}
          AMNAYAR_KEY_ALIAS: ${{ secrets.AMNAYAR_KEY_ALIAS }}
          AMNAYAR_KEY_PASSWORD: ${{ secrets.AMNAYAR_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$AMNAYAR_KEYSTORE_BASE64" ] || [ -z "$AMNAYAR_KEYSTORE_PASSWORD" ] || [ -z "$AMNAYAR_KEY_ALIAS" ] || [ -z "$AMNAYAR_KEY_PASSWORD" ]; then
            echo "::error::Release signing secrets are missing. Refusing to build or publish a debug-signed APK as the production download."
            exit 1
          fi
          echo "$AMNAYAR_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/amnayar-release.jks"
          test -s "$RUNNER_TEMP/amnayar-release.jks"
          echo "AMNAYAR_KEYSTORE_PATH=$RUNNER_TEMP/amnayar-release.jks" >> "$GITHUB_ENV"
          echo "AMNAYAR_RELEASE_SIGNING_READY=true" >> "$GITHUB_ENV"

      - name: Build installable APK
        working-directory: android
        run: |
          test "$AMNAYAR_RELEASE_SIGNING_READY" = "true"
          gradle --no-daemon :app:assembleRelease

      - name: Verify APK
        run: |
          set -euxo pipefail
          test "$AMNAYAR_RELEASE_SIGNING_READY" = "true"
          APK="android/app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          mkdir -p dist
          cp "$APK" "dist/AmnaYar.apk"
          echo "Verified release-signed APK with apksigner; ready for market upload."

      - name: Publish APK to AmnaYar website
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          published=false
          for attempt in 1 2 3; do
            git fetch origin main
            git checkout -B main origin/main
            mkdir -p web/downloads
            install -m 0644 dist/AmnaYar.apk web/downloads/AmnaYar.apk
            git add web/downloads/AmnaYar.apk
            if git diff --cached --quiet; then
              echo "Website APK is already up to date."
              published=true
              break
            fi
            git commit -m "Publish AmnaYar Android APK"
            if git push origin main; then
              published=true
              break
            fi
            echo "Publish raced with another commit; retrying against latest main."
          done
          test "$published" = true

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: AmnaYar-Android-APK
          path: dist/AmnaYar.apk
          if-no-files-found: error
          compression-level: 0
# Rebuild requested for the current main revision; verify the resulting artifact before release.
