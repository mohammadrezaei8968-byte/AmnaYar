name: Build AmnaYar Signed Release APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/android-apk.yml'
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      AMNAYAR_KEYSTORE_PATH: ${{ github.workspace }}/android/amnayar-release.jks
      AMNAYAR_KEYSTORE_PASSWORD: ${{ secrets.AMNAYAR_KEYSTORE_PASSWORD }}
      AMNAYAR_KEY_ALIAS: ${{ secrets.AMNAYAR_KEY_ALIAS }}
      AMNAYAR_KEY_PASSWORD: ${{ secrets.AMNAYAR_KEY_PASSWORD }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Verify release-signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.AMNAYAR_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64" || (echo "Missing GitHub secret AMNAYAR_KEYSTORE_BASE64" && exit 1)
          test -n "$AMNAYAR_KEYSTORE_PASSWORD" || (echo "Missing GitHub secret AMNAYAR_KEYSTORE_PASSWORD" && exit 1)
          test -n "$AMNAYAR_KEY_ALIAS" || (echo "Missing GitHub secret AMNAYAR_KEY_ALIAS" && exit 1)
          test -n "$AMNAYAR_KEY_PASSWORD" || (echo "Missing GitHub secret AMNAYAR_KEY_PASSWORD" && exit 1)
          echo "$KEYSTORE_BASE64" | base64 --decode > "$AMNAYAR_KEYSTORE_PATH"
          test -s "$AMNAYAR_KEYSTORE_PATH"
          keytool -list -keystore "$AMNAYAR_KEYSTORE_PATH" -storepass "$AMNAYAR_KEYSTORE_PASSWORD" -alias "$AMNAYAR_KEY_ALIAS" >/dev/null

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0

      - name: Install AmnaYar launcher logo
        run: |
          mkdir -p android/app/src/main/res/drawable
          curl --fail --location --retry 3 "https://raw.githubusercontent.com/mohammadrezaei8968-byte/AmnaYar/main/web/assets/logo-amnayar.png" -o android/app/src/main/res/drawable/logo.png
          file android/app/src/main/res/drawable/logo.png

      - name: Build signed release APK
        uses: gradle/gradle-build-action@v3
        with:
          gradle-version: '8.7'
          build-root-directory: android
          arguments: --no-daemon :app:assembleRelease

      - name: Verify release APK signature
        run: |
          APK="android/app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$APK"
          ls -lh "$APK"
          sha256sum "$APK"

      - name: Upload signed release APK
        uses: actions/upload-artifact@v4
        with:
          name: AmnaYar-Signed-Release-APK
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30
