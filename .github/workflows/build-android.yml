name: Build AmnaYar Android APK

on:
  push:
    branches: ["main"]
    paths:
      - "android/**"
      - ".github/workflows/build-android.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11"

      - name: Build release APK
        working-directory: android
        run: gradle --no-daemon :app:assembleRelease

      - name: Locate and collect APK
        run: |
          set -euxo pipefail
          echo "Build output tree:"
          find "$GITHUB_WORKSPACE/android/app/build/outputs" -maxdepth 5 -type f -print || true
          echo "All APK files:"
          find "$GITHUB_WORKSPACE" -type f -name "*.apk" -print
          APK="$(find "$GITHUB_WORKSPACE/android/app/build" -type f -name "*.apk" | head -n 1)"
          test -n "$APK"
          cp "$APK" "$GITHUB_WORKSPACE/AmnaYar.apk"
          ls -lh "$GITHUB_WORKSPACE/AmnaYar.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AmnaYar-Android-APK
          path: "$GITHUB_WORKSPACE/AmnaYar.apk"
          if-no-files-found: error
