name: Build AmnaYar Android APK

on:
  push:
    branches: ["main"]
    paths:
      - "android/**"
      - ".github/workflows/build-android.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11"

      - name: Install AmnaYar logo
        run: |
          set -euxo pipefail
          mkdir -p android/app/src/main/res/drawable
          curl -fsSL "https://raw.githubusercontent.com/mohammadrezaei8968-byte/AmnaYar/main/web/assets/logo-amnayar.png" -o android/app/src/main/res/drawable/logo.png
          test -s android/app/src/main/res/drawable/logo.png

      - name: Build installable debug APK
        working-directory: android
        run: gradle --no-daemon :app:assembleDebug

      - name: Verify APK
        run: |
          set -euxo pipefail
          APK="$GITHUB_WORKSPACE/android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK" || true

      - name: Prepare APK for upload
        run: |
          set -euxo pipefail
          SRC="$GITHUB_WORKSPACE/android/app/build/outputs/apk/debug/app-debug.apk"
          DEST="$GITHUB_WORKSPACE/AmnaYar.apk"
          test -f "$SRC"
          cp "$SRC" "$DEST"
          test -s "$DEST"
          file "$DEST"
          ls -lh "$DEST"

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: AmnaYar-Android-APK
          path: AmnaYar.apk
          if-no-files-found: error
          overwrite: true
          compression-level: 0
