name: Build AmnaYar Android APK

on:
  push:
    branches: ["main"]
    paths:
      - "android/**"
      - ".github/workflows/build-android.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11"

      - name: Build release APK
        working-directory: android
        run: gradle --no-daemon :app:assembleRelease

      - name: Verify APK output
        run: |
          echo "APK files:"
          find "$GITHUB_WORKSPACE/android" -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AmnaYar-Android-APK
          path: "$GITHUB_WORKSPACE/android/app/build/outputs/apk/release/*.apk"
          if-no-files-found: error
